<section class="bg-white p-4 rounded-2xl border border-emerald-200 shadow-sm space-y-3">
  <h2 class="font-extrabold text-gray-900">📸 ถ่ายรูปและเพิ่มผักใหม่</h2>
  <label class="flex flex-col items-center justify-center gap-2 p-4 border-2 border-dashed rounded-2xl bg-gray-50 cursor-pointer">
    <img id="itemImagePreview" class="hidden w-40 h-40 object-cover rounded-xl" alt="ตัวอย่างรูปสินค้า">
    <span id="itemImagePrompt" class="text-sm text-gray-500">แตะเพื่อเปิดกล้องหรือเลือกรูป</span>
    <input id="itemImageInput" type="file" accept="image/*" capture="environment" class="hidden">
  </label>
  <label class="block text-xs font-bold">ชื่อสินค้า
    <input id="newItemName" maxlength="120" placeholder="เช่น มะนาวแป้น" class="w-full p-3 mt-1 border rounded-xl text-sm">
  </label>
  <label class="block text-xs font-bold">หน่วยนับ
    <div class="flex gap-2 mt-1">
      <select id="newItemUnit" class="flex-1 p-3 border rounded-xl bg-white text-sm font-semibold focus:ring-2 focus:ring-emerald-500"></select>
      <button type="button" data-action="prompt-add-unit" class="px-3 py-2 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-bold text-xs rounded-xl border border-emerald-300 shadow-sm shrink-0 flex items-center gap-1">
        <span>➕ เพิ่มหน่วย</span>
      </button>
    </div>
  </label>
  <p class="text-xs text-gray-500">รูปจะถูกย่อไม่เกิน 400px และแปลงเป็น WebP ก่อนอัปโหลด</p>
  <button data-action="save-item" id="saveItemButton" class="w-full py-3 bg-emerald-700 text-white rounded-xl font-bold transition disabled:cursor-wait disabled:opacity-80">บันทึกสินค้า</button>
  <p id="itemStatus" class="hidden text-sm font-semibold" role="status" aria-live="polite"></p>
</section>
